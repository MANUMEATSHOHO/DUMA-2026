name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download fonts
        run: |
          mkdir -p app/src/main/assets/www/fonts
          cd app/src/main/assets/www/fonts
          bash "$GITHUB_WORKSPACE/tools/get-fonts.sh"

      # Для магазинной сборки убираем блок с Telegram-ссылкой (см. docs/PUBLISHING_CHECKLIST.md).
      # Хотите оставить: удалите этот шаг целиком.
      - name: Disable social links
        run: sed -i 's/window.DUMA_CFG={social:true}/window.DUMA_CFG={social:false}/' app/src/main/assets/www/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore keystore (optional)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_BASE64 не задан: APK будет подписан debug-ключом"
          fi

      - name: Build APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: duma-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
